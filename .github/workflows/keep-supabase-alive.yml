name: Keep Supabase Alive

on:
  schedule:
    # Runs at 00:00 UTC every Wednesday and Sunday (twice a week)
    - cron: '0 0 * * 0,3'
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API to prevent pause
        run: |
          echo "Pinging Supabase Project..."
          curl -s -o /dev/null -w "%{http_code}" -X GET "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}"
